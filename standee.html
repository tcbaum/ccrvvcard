<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taylor Baum - Clear Creek RVs Standee</title>
    <!-- Brand Font Family Import: Montserrat & Open Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,700;0,900;1,400&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        heading: ['Montserrat', 'sans-serif'],
                        body: ['Open Sans', 'sans-serif'],
                    },
                    colors: {
                        brandBlue: '#3B99FC',
                        brandAmber: '#F59E0B',
                        darkSlate: '#111827',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Open Sans', sans-serif; }
        h1, h2, h3, .font-heading { font-family: 'Montserrat', sans-serif; }
        /* Fixed 4x6 inch print aspect ratio */
        .standee-card { width: 4in; height: 6in; }
        @media print {
            body { background: none; padding: 0; margin: 0; }
            .no-print { display: none; }
            .standee-card { box-shadow: none; border: 1px solid #e2e8f0; }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-6 text-darkSlate">

    <!-- Print Action Button (Hidden during print) -->
    <div class="no-print mb-4 text-center">
        <button onclick="window.print()" class="bg-brandAmber hover:bg-amber-500 text-darkSlate font-heading font-black uppercase tracking-wider text-xs py-2.5 px-8 rounded-full shadow-lg transition transform active:scale-95">
            <i class="fa-solid fa-print mr-2"></i> Print Standee
        </button>
    </div>

    <!-- 4x6 Outer Standee Container -->
    <div class="standee-card bg-slate-100 relative overflow-hidden rounded-2xl p-5 border border-slate-200/80 shadow-2xl flex flex-col justify-between">
        
        <!-- Mesh Orbs Backdrop -->
        <div class="absolute top-12 left-1/2 -translate-x-1/2 w-56 h-56 bg-brandBlue/25 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute bottom-8 right-4 w-36 h-36 bg-brandAmber/30 rounded-full blur-2xl pointer-events-none"></div>

        <!-- Heavy Mesh Glass Overlay Card -->
        <div class="relative z-10 w-full h-full bg-white/70 backdrop-blur-xl rounded-xl border border-white/60 shadow-[0_8px_32px_0_rgba(59,153,252,0.12)] p-4 flex flex-col justify-between">
            
            <!-- Header: Scaled Logo -->
            <div class="text-center pt-1">
                <img src="clear-creek-rvs-logo.png" alt="Clear Creek RVs" class="h-16 mx-auto object-contain">
            </div>

            <!-- Center: Scaled QR Code & Montserrat Title -->
            <div class="my-auto text-center flex flex-col items-center">
                <div class="bg-white p-3.5 rounded-2xl shadow-md border-2 border-brandBlue mb-2.5">
                    <div id="qrcode"></div>
                </div>
                <h2 class="font-heading font-black text-sm uppercase tracking-wider text-brandAmber">Scan to Connect</h2>
                <p class="font-body text-[11px] font-medium text-slate-600 leading-relaxed mt-0.5">Browse Inventory • Trade-In • Reviews</p>
            </div>

            <!-- Profile & Credentials Panel -->
            <div class="bg-white/70 backdrop-blur-md rounded-xl p-3.5 border border-slate-200/50 shadow-sm">
                <div class="flex items-center justify-between">
                    <div>
                        <h1 class="font-heading font-black text-lg uppercase tracking-wider leading-tight text-darkSlate">Taylor Baum</h1>
                        <p class="font-heading font-bold text-xs text-brandBlue uppercase tracking-wider mt-0.5">Sales Representative</p>
                        <p class="font-body text-xs font-semibold text-slate-700 mt-1">
                            <i class="fa-solid fa-phone text-brandBlue mr-1"></i> (325) 252-9650
                        </p>
                    </div>
                    <!-- Top 50 Badge -->
                    <div class="text-center border-l border-slate-300/60 pl-3.5">
                        <img src="top-fifty.jpg" alt="Top 50 Award" class="w-12 h-12 object-contain mx-auto rounded">
                        <span class="font-heading font-black text-[8px] text-brandAmber uppercase tracking-wider block mt-1">Top 50 Dealer</span>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="text-center pt-2 border-t border-slate-200/60">
                <p class="font-heading font-bold text-[9px] text-slate-500 uppercase tracking-wider">Clear Creek RVs • Abilene, TX</p>
            </div>

        </div>
    </div>

    <script>
        // Generate QR code dynamically
        new QRCode(document.getElementById("qrcode"), {
            text: window.location.href, // Replaces with current URL or custom landing page link
            width: 140,
            height: 140,
            colorDark : "#111827",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
